<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; connect-src https://qfvzgmkfkxvvcmixcmzy.supabase.co;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>TV Board - BarryTech Repair Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap">
    <style>
        /* A flat, dark board for the classroom TV, like a departures screen.
           Everything scales with the screen width; on a wide screen it
           fills the height exactly, and each column shows what fits. */
        :root {
            color-scheme: dark;
            --bg: #0a0e13;
            --panel: rgba(22, 31, 43, .82);
            --line: #1f2a36;
            --ink: #e8eef4;
            --dim: #8b98a7;
            --faint: #5c6876;
            --gold: #f5c542;
            --amber: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }
        body {
            display: flex; flex-direction: column; min-height: 100vh;
            color: var(--ink);
            /* Soft navy and teal glows; quiet enough that the cards stay the focus. */
            background:
                radial-gradient(ellipse 70% 60% at 0% 0%, rgba(37, 99, 235, .28), transparent),
                radial-gradient(ellipse 60% 60% at 100% 100%, rgba(20, 184, 166, .18), transparent),
                linear-gradient(160deg, #0c1322, var(--bg) 55%, #091318);
            background-attachment: fixed;
            font: clamp(14px, 1vw, 30px)/1.35 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-variant-numeric: tabular-nums;
        }
        .tv-top {
            display: flex; align-items: center; gap: 1.2em; padding: .75em 1.5em;
            border-bottom: 1px solid var(--line);
            font-size: .85em; letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
        }
        .tv-top h1 { flex: 1; font-size: 1em; font-weight: 700; color: var(--ink); }
        .tv-top h1 span { color: var(--gold); }
        .tv-status.stale { color: var(--amber); }
        .tv-signout {
            background: none; border: 1px solid var(--line); border-radius: 3px; padding: .35em .9em;
            color: var(--dim); font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer;
        }
        .tv-signout:hover { color: var(--ink); border-color: var(--dim); }

        #tvBoard { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .tv-hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 1em; padding: 1.1em 1.5em 1.2em; }
        .tv-big { display: block; font-size: 4.4em; font-weight: 300; line-height: 1; letter-spacing: -.02em; }
        .tv-sub { display: block; margin-top: .35em; color: var(--dim); font-size: 1.05em; }
        .tv-repaired { text-align: right; }
        .tv-repaired .tv-sub { text-transform: uppercase; letter-spacing: .1em; font-size: .85em; }

        .tv-columns {
            flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr);
            border-top: 1px solid var(--line);
        }
        .tv-column { display: flex; flex-direction: column; gap: .45em; min-height: 0; overflow: hidden; padding: 1em; }
        .tv-column + .tv-column { border-left: 1px solid var(--line); }
        .tv-column header { margin-bottom: .45em; padding-top: .6em; border-top: 3px solid var(--accent); }
        .tv-count { display: block; font-size: 2.6em; font-weight: 600; line-height: 1.05; }
        .tv-label { color: var(--dim); font-size: .8em; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
        .tv-card { flex: none; padding: .55em .8em; background: var(--panel); border-left: 3px solid var(--accent); border-radius: 2px; }
        .tv-card b { display: flex; align-items: baseline; gap: .45em; font-size: 1.15em; font-weight: 600; }
        .tv-card small { display: block; margin-top: .1em; color: var(--dim); font-size: .9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tv-code { color: var(--gold); font-weight: 700; }
        .tv-flag { margin-left: auto; color: var(--amber); font-size: .62em; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
        .tv-empty, .tv-more { color: var(--faint); font-size: .9em; }
        .tv-waiting { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: .5em; padding: 2em 16px; border-top: 1px solid var(--line); text-align: center; }
        .tv-waiting strong { font-size: 3.6em; font-weight: 300; line-height: 1.1; letter-spacing: -.01em; }
        .tv-waiting span { color: var(--dim); font-size: 1.3em; }

        .tv-login { width: min(24em, calc(100% - 32px)); margin: 12vh auto; padding: 1.6em; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; font-size: clamp(16px, 1.1vw, 28px); }
        .tv-login h2 { font-size: 1.3em; }
        .tv-login p { margin-top: .3em; color: var(--dim); }
        .tv-login label { display: block; margin: 1.1em 0 .45em; color: var(--dim); font-size: .8em; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
        .tv-login input {
            width: 100%; padding: .7em; background: rgba(10, 14, 19, .6); border: 1px solid var(--line); border-radius: 3px;
            color: var(--ink); font: inherit; font-weight: 600;
        }
        .tv-login input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
        .tv-error { min-height: 1.4em; margin-top: .8em; color: #f87171; font-size: .9em; }
        .tv-submit { width: 100%; margin-top: .4em; padding: .75em; background: var(--ink); color: var(--bg); border: 0; border-radius: 3px; font: inherit; font-weight: 700; cursor: pointer; }

        @media (min-width: 901px) { body { height: 100vh; } }
        @media (max-width: 900px) {
            .tv-top, .tv-hero { padding-inline: 16px; }
            .tv-big { font-size: 3em; }
            .tv-columns { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
            .tv-column { padding-inline: 16px; }
            .tv-column + .tv-column { border-left: 0; border-top: 1px solid var(--line); }
        }
    </style>
</head>
<body>

<header class="tv-top">
    <h1>BarryTech Repair Lab <span id="tvClass"></span></h1>
    <span class="tv-status" id="tvStatus"></span>
    <button class="tv-signout" id="tvSignOut" hidden onclick="signOut()">Sign out</button>
</header>

<form class="tv-login" id="tvLogin" hidden onsubmit="event.preventDefault(); signIn();">
    <h2>TV board</h2>
    <p>Shows the tickets and today's line, switching between AM and PM on its own. It can't change anything.</p>
    <label for="tvPassword">TV password</label>
    <input type="password" id="tvPassword" autocomplete="current-password">
    <p class="tv-error" id="tvError" role="alert"></p>
    <button class="tv-submit" type="submit">Show the board</button>
</form>

<main id="tvBoard" hidden>
    <div class="tv-hero">
        <div>
            <span class="tv-big" id="tvClock"></span>
            <span class="tv-sub" id="tvDate"></span>
        </div>
        <div class="tv-repaired">
            <span class="tv-big" id="tvRepaired"></span>
            <span class="tv-sub">Devices repaired</span>
        </div>
    </div>
    <div class="tv-columns" id="tvColumns"></div>
    <div class="tv-waiting" id="tvWaiting" hidden>
        <strong id="tvWaitingFor"></strong>
        <span id="tvWaitingAt"></span>
    </div>
</main>

<script>
// The classroom TV board: a view-only login (025_tv_board.sql) that only
// reads display_board(), refreshed every 30 seconds. It stays signed in
// on this TV (90 days) so nobody has to type the password each morning,
// and follows the class schedule on its own (026_tv_follows_schedule.sql).
const SUPABASE_URL = 'https://qfvzgmkfkxvvcmixcmzy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmdnpnbWtma3h2dmNtaXhjbXp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMTQ3NjMsImV4cCI6MjA4OTc5MDc2M30.AKluwHFXo9mrWrhUuoxNquJvzQo_E6nHWH9Sfj_eEEo';
const TOKEN_KEY = 'btTvToken';

// Columns left to right, with the ticket statuses each one holds.
const COLUMNS = [
    { title: "Today's line", accent: '#f5c542' },
    { title: 'Not started', statuses: ['pending', 'assigned'], accent: '#94a3b8' },
    { title: 'Repairing', statuses: ['in_progress'], accent: '#3b82f6' },
    { title: 'Waiting for part', statuses: ['waiting_part'], accent: '#f59e0b' },
    { title: 'Final check', statuses: ['review'], accent: '#a78bfa' },
    { title: 'Ready for pickup', statuses: ['completed'], accent: '#22c55e' }
];

// Class times on the TV's clock. Between them the board waits for the next class.
const CLASSES = [
    { name: 'AM', arrives: '7:45', leaves: '10:20' },
    { name: 'PM', arrives: '11:45', leaves: '14:20' }
];

let token = null;
let lastBoard = null;
let shownClass = null; // e.g. 'AM live', to notice when the schedule moves on
try { token = localStorage.getItem(TOKEN_KEY); } catch { /* blocked storage: sign in each time */ }

const esc = text => String(text ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

async function rpc(fn, args = {}) {
    const headers = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' };
    if (token) headers['x-staff-token'] = token;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers, body: JSON.stringify(args) });
    if (!res.ok) throw new Error(`${fn}: ${res.status}`);
    return res.json();
}

function setToken(value) {
    token = value;
    try { value ? localStorage.setItem(TOKEN_KEY, value) : localStorage.removeItem(TOKEN_KEY); } catch { /* not kept */ }
}

function showLogin() {
    setToken(null);
    document.getElementById('tvBoard').hidden = true;
    document.getElementById('tvSignOut').hidden = true;
    document.getElementById('tvClass').textContent = '';
    document.getElementById('tvStatus').textContent = '';
    document.getElementById('tvLogin').hidden = false;
}

const minutes = time => { const [h, m] = time.split(':'); return h * 60 + Number(m); };
const time12h = time => new Date(2000, 0, 1, ...time.split(':')).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

// The class here now ({ live: true }), or the next one to arrive. After
// PM leaves (and on weekends) that's tomorrow's AM.
function classNow(now = new Date()) {
    const m = now.getHours() * 60 + now.getMinutes();
    const here = CLASSES.find(c => m >= minutes(c.arrives) && m < minutes(c.leaves));
    return here ? { ...here, live: true } : { ...(CLASSES.find(c => m < minutes(c.arrives)) || CLASSES[0]), live: false };
}

async function signIn() {
    const password = document.getElementById('tvPassword').value;
    const error = document.getElementById('tvError');
    if (!password) return error.textContent = 'Enter the TV password.';
    try {
        const newToken = await rpc('staff_login', { p_role: 'tv', p_password: password });
        if (!newToken) return error.textContent = 'Wrong password.';
        setToken(newToken);
    } catch {
        return error.textContent = "Couldn't reach the server. Check the internet and try again.";
    }
    error.textContent = '';
    document.getElementById('tvPassword').value = '';
    document.getElementById('tvLogin').hidden = true;
    refresh();
}

async function signOut() {
    try { await rpc('staff_logout'); } catch { /* the session ends on its own */ }
    showLogin();
}

function card(title, details) {
    return `<div class="tv-card"><b>${title}</b><small>${details.filter(Boolean).join(' · ')}</small></div>`;
}

function columnCards(column, board) {
    if (!column.statuses) {
        return board.line.map(r => card(`${r.code ? `<span class="tv-code">#${r.code}</span>` : ''}${esc(r.name)}`, [esc(r.device)]));
    }
    return board.tickets.filter(t => column.statuses.includes(t.status)).map(t => card(
        `${esc(t.name)}${t.priority && t.status !== 'completed' ? '<span class="tv-flag">Priority</span>' : ''}`,
        [esc(t.device), t.status === 'completed' ? '' : t.techs?.length ? esc(t.techs.join(', ')) : 'Needs a tech']));
}

// Drop cards from the bottom of a full column until it fits, and say how
// many are hidden. (Stacked on a phone, nothing overflows.)
function fitColumns() {
    document.querySelectorAll('.tv-column').forEach(col => {
        const cards = [...col.querySelectorAll('.tv-card')];
        const more = col.querySelector('.tv-more');
        let hidden = 0;
        while (col.scrollHeight > col.clientHeight && cards.length) {
            cards.pop().remove();
            more.hidden = false;
            more.textContent = `+${++hidden} more`;
        }
    });
}

function render(board) {
    lastBoard = board;
    const cls = classNow();
    document.getElementById('tvClass').textContent = cls.live ? `· ${cls.name} class` : '';
    document.getElementById('tvRepaired').textContent = board.repaired;
    document.getElementById('tvBoard').hidden = false;
    document.getElementById('tvSignOut').hidden = false;
    document.getElementById('tvColumns').hidden = !cls.live;
    document.getElementById('tvWaiting').hidden = cls.live;
    if (!cls.live) {
        document.getElementById('tvWaitingFor').textContent = `Waiting for ${cls.name} to arrive`;
        document.getElementById('tvWaitingAt').textContent = `${cls.name} class starts at ${time12h(cls.arrives)}`;
        return;
    }
    // Each column's count sits on top, so the counts read as one strip.
    document.getElementById('tvColumns').innerHTML = COLUMNS.map(c => {
        const cards = columnCards(c, board);
        return `<section class="tv-column" style="--accent:${c.accent}">
            <header><span class="tv-count">${cards.length}</span><span class="tv-label">${c.title}</span></header>
            ${cards.join('') || '<p class="tv-empty">None</p>'}<p class="tv-more" hidden></p></section>`;
    }).join('');
    fitColumns();
}

async function refresh() {
    if (!token) return showLogin();
    const status = document.getElementById('tvStatus');
    try {
        const cls = classNow();
        shownClass = `${cls.name} ${cls.live}`;
        const board = await rpc('display_board', { p_class: cls.name });
        if (!board) return showLogin(); // the session ran out
        render(board);
        status.textContent = `Updated ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
        status.classList.remove('stale');
    } catch {
        status.textContent = 'Offline · showing the last update';
        status.classList.add('stale');
    }
}

function tick() {
    const now = new Date();
    document.getElementById('tvClock').textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    document.getElementById('tvDate').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    // A class just arrived or left: switch now instead of at the next refresh.
    const cls = classNow(now);
    if (shownClass && shownClass !== `${cls.name} ${cls.live}`) refresh();
}

window.addEventListener('resize', () => lastBoard && render(lastBoard));

// Keep the TV's screen from sleeping while the board is open (where supported).
const keepAwake = () => navigator.wakeLock?.request('screen').catch(() => {});
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && keepAwake());

tick();
setInterval(tick, 10 * 1000);
keepAwake();
refresh();
setInterval(refresh, 30 * 1000);
</script>
</body>
</html>
